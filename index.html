<body>
    <div class="clock-card" role="timer" aria-live="polite" aria-label="Текущее время в Екатеринбурге">
        <div class="city-badge">
            <span class="city-icon">🏔️</span>
            <span class="city-name">Екатеринбург</span>
        </div>

        <div class="time-display" id="timeEkaterinburg">--:--:--</div>

        <div class="timezone-row">
            <span class="timezone-abbr">ЕКБ · YEKT</span>
            <span class="utc-offset">UTC+5</span>
        </div>

        <div class="date-info" id="dateEkaterinburg">
            загрузка даты...
        </div>

        <div class="meta-note">
            <span class="highlight">Свердловская область</span> · без перехода на летнее время
        </div>
    </div>

    <script>
        (function() {
            // Устанавливаем часовой пояс для Екатеринбурга: Asia/Yekaterinburg (UTC+5, без DST)
            const timeZone = 'Asia/Yekaterinburg';
            
            // Опции для форматирования времени
            const timeOptions = {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false,
                timeZone: timeZone
            };

            // Опции для форматирования даты
            const dateOptions = {
                weekday: 'long',      // понедельник
                day: 'numeric',       // 1
                month: 'long',        // января
                year: 'numeric',      // 2025
                timeZone: timeZone
            };

            // Получаем элементы DOM
            const timeElement = document.getElementById('timeEkaterinburg');
            const dateElement = document.getElementById('dateEkaterinburg');

            // Функция обновления отображения
            function updateEkaterinburgTime() {
                try {
                    const now = new Date();
                    
                    // Форматируем время с указанием часового пояса
                    const timeString = new Intl.DateTimeFormat('ru-RU', timeOptions).format(now);
                    
                    // Форматируем дату (в родительном падеже для месяца и дня недели)
                    // но Intl выдаст именительный падеж, поэтому немного корректируем окончания
                    let dateString = new Intl.DateTimeFormat('ru-RU', dateOptions).format(now);
                    
                    // Улучшаем склонение: "понедельник, 9 сентября" -> "понедельник, 9 сентября 2025"
                    // (стандартный формат уже содержит год, но если год не нужен, можно убрать, но оставим как есть)
                    
                    // Дополнительно можно преобразовать месяц в родительный падеж для красоты:
                    // но стандартный Intl даёт "9 сентября 2025 г." – это уже корректно.
                    // Оставим как есть, просто уберём возможную точку после "г" если есть
                    dateString = dateString.replace(/\s*г\.?\s*$/i, '');
                    
                    // Записываем в элементы
                    timeElement.textContent = timeString;
                    dateElement.textContent = dateString;
                } catch (error) {
                    // Запасной вариант, если что-то пойдёт не так (например, старый браузер)
                    timeElement.textContent = '--:--:--';
                    dateElement.textContent = 'не удалось получить дату';
                    console.warn('Ошибка форматирования времени/даты:', error);
                }
            }

            // Немедленное обновление
            updateEkaterinburgTime();

            // Обновляем каждую секунду (для секунд)
            setInterval(updateEkaterinburgTime, 1000);

            // Дополнительно: обновим при загрузке, если вкладка была в фоне
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    updateEkaterinburgTime();
                }
            });
        })();
    </script>
</body>
